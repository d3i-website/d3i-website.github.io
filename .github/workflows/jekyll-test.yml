name: Test Jekyll Build

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Check Jekyll configuration
        run: bundle exec jekyll doctor

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The CMS refuses sign-in on a config that fails its schema. Validate
      # against the schema of the Sveltia version pinned in admin/index.html.
      - name: Validate CMS config
        run: |
          npm install --no-save --no-package-lock @cfworker/json-schema yaml
          node cms/validate-config.mjs

      - name: Build site
        run: bundle exec jekyll build --verbose
        env:
          JEKYLL_ENV: production

      - name: Check for build artifacts
        run: |
          if [ ! -d "_site" ]; then
            echo "Error: _site directory not created"
            exit 1
          fi
          echo "Build successful - _site directory exists"
          
      - name: List generated pages
        run: find _site -name "*.html" | head -20