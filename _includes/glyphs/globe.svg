{%- comment -%}
  Globe glyph for the routes component: circle, one meridian, equator and
  two faint latitude lines. Stroke-only, coloured via currentColor.
{%- endcomment -%}
<svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">
  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <circle cx="20" cy="20" r="16"/>
    <ellipse cx="20" cy="20" rx="7" ry="16"/>
    <path d="M4 20 H36"/>
    <path d="M7.5 11 H32.5 M7.5 29 H32.5" stroke-width="1.75" opacity="0.6"/>
  </g>
</svg>
