<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>datadonation.eu</title>
<style>
  /* The system's face: the network cover slide (SlideCover, layout "network") at half size, cut off
     under its subtitle. The band is assets/Slides/cover-network.svg as the bundle carries it; the
     name is the slide's title, the serif at 420 on white; the eyebrow and the subtitle are
     Nunito Sans. Every colour comes from the slide component, whose colours are tokens. */
  html, body { margin:0; background:var(--surface); }
  body { overflow:hidden; }
  .cover { width:960px; height:352px; overflow:hidden; }
  .slide { width:1920px; height:1080px; transform:scale(.5); transform-origin:top left; }
</style>
</head>
<body>
<div class="cover"><div class="slide" id="cover"></div></div>
<script>
var D = window.D3I, h = React.createElement;
ReactDOM.createRoot(document.getElementById('cover')).render(h(D.SlideCover, {
  layout: 'network',
  markSrc: '/_blob/866ac59ea0ec14747c485ec480342ef0',
  eyebrow: 'Design system',
  title: 'datadonation.eu',
  subtitle: 'Digital trace data, donated to science by citizens'
}));
</script>
</body>
</html>
