  .stay { fill:var(--blue-tint); stroke:var(--road); stroke-width:1; }
  .dot { fill:var(--blue); opacity:.4; }
  /* a 32px-wide pill: rx is half its width, which is the radius-lg token */
  .pill { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-32); right:var(--space-32); bottom:var(--space-32); }
  .name { margin:0; padding:0; font-size:64px; line-height:.95; font-weight:900; letter-spacing:-.015em; color:var(--heading); }
  .tag { margin:var(--space-8) 0 0 2px; padding:0; font-size:14px; line-height:20px; color:var(--text-muted); font-family:var(--font-sans); }
