<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PeopleGrid — preview</title>
<style>.pv{padding:0.5rem 1.5rem 0;max-width:54rem}.pv .people-grid{margin-bottom:0}</style></head>
<body>
<div id="root" class="pv"></div>
<script>
  var D = window.D3I, h = React.createElement;
  /* No team photos are copied into this system: a blank image stands in, so the circle shows. */
  var blank = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E";
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(D.PeopleGrid, {
      tags: ['Lead researcher', 'Research engineer', 'Methodologist', 'Legal scholar', 'Community manager'],
      members: [
        { name: 'Dr. L. (Laura) Boeschoten', href: '#', photo: blank, tags: ['Lead researcher', 'D3I', 'SSHOC-NL'] },
        { name: 'Prof. Dr. T.B. (Theo) Araujo', href: '#', photo: blank, tags: ['Lead researcher', 'D3I', 'RIGHTS'] },
        { name: 'Dr. N.C. (Niek) de Schipper', href: '#', photo: blank, tags: ['Research engineer', 'SoDa'] }
      ]
    })
  );
</script>
</body>
</html>
